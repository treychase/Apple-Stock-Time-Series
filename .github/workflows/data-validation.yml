name: data-validation

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 12 * * 1-5"  # weekdays at 12:00 UTC (after US market open data settles)
  workflow_dispatch:

jobs:
  validate:
    name: validate market data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate price history
        # Pulls live data from the stock API and runs the validation suite.
        # If the API is unreachable, the loader falls back to the bundled
        # sample dataset so the check still exercises the validation logic.
        run: python scripts/validate_data.py
